name: Release

on:
  workflow_dispatch:
    inputs:
      env:
        type: choice
        description: Environment
        default: production
        options:
          - production
          - dev

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun test

      - run: bun run build.ts

      - name: Bump version
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm install -g @circlesac/oneup
          oneup version
          VERSION=$(jq -r .version package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: versioned-files
          path: package.json

  build:
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: bun-darwin-x64
            name: cgrok-darwin-x64
          - os: macos-latest
            target: bun-darwin-arm64
            name: cgrok-darwin-arm64
          - os: ubuntu-latest
            target: bun-linux-x64
            name: cgrok-linux-x64
          - os: ubuntu-latest
            target: bun-linux-arm64
            name: cgrok-linux-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: versioned-files

      - name: Build binary
        run: |
          mkdir -p node_modules/react-devtools-core
          echo '{"main":"index.js"}' > node_modules/react-devtools-core/package.json
          echo 'export default {initialize(){},connectToDevTools(){}}' > node_modules/react-devtools-core/index.js
          bun build --compile --target=${{ matrix.target }} --outfile=cgrok src/main.ts
          if [[ "${{ matrix.target }}" == bun-darwin-* ]]; then
            codesign --remove-signature cgrok
            codesign --force --deep -s - cgrok
          fi
          tar czf ${{ matrix.name }}.tar.gz cgrok

      - name: Package Debian artifact
        if: startsWith(matrix.target, 'bun-linux')
        run: |
          case "${{ matrix.target }}" in
            bun-linux-x64) arch=amd64 ;;
            bun-linux-arm64) arch=arm64 ;;
            *) exit 1 ;;
          esac
          ./packaging/build-deb.sh "cgrok" "${{ needs.version.outputs.version }}" "$arch" .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.*
            cgrok_*.deb

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.deb
            bin/install.sh

  publish-npm:
    needs: [version, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: versioned-files

      - run: bun run build.ts

      - name: Publish
        run: npm publish --access public

  publish-package-indexes:
    needs: [version, release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Update Homebrew and APT indexes
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION=${{ needs.version.outputs.version }}

          SHA_DARWIN_ARM64=$(shasum -a 256 artifacts/cgrok-darwin-arm64/*.tar.gz | cut -d' ' -f1)
          SHA_DARWIN_X64=$(shasum -a 256 artifacts/cgrok-darwin-x64/*.tar.gz | cut -d' ' -f1)
          SHA_LINUX_ARM64=$(shasum -a 256 artifacts/cgrok-linux-arm64/*.tar.gz | cut -d' ' -f1)
          SHA_LINUX_X64=$(shasum -a 256 artifacts/cgrok-linux-x64/*.tar.gz | cut -d' ' -f1)

          git clone https://x-access-token:${GH_TOKEN}@github.com/circlesac/homebrew-tap.git
          cd homebrew-tap
          cp ../homebrew/cgrok.rb.template Formula/cgrok.rb
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" Formula/cgrok.rb
          sed -i "s/SHA_DARWIN_ARM64/${SHA_DARWIN_ARM64}/g" Formula/cgrok.rb
          sed -i "s/SHA_DARWIN_X64/${SHA_DARWIN_X64}/g" Formula/cgrok.rb
          sed -i "s/SHA_LINUX_ARM64/${SHA_LINUX_ARM64}/g" Formula/cgrok.rb
          sed -i "s/SHA_LINUX_X64/${SHA_LINUX_X64}/g" Formula/cgrok.rb

          mapfile -t packages < <(find ../artifacts -type f -name 'cgrok_*.deb' | sort)
          test "${#packages[@]}" -eq 2
          for package in "${packages[@]}"; do
            ./apt/scripts/add-package.sh "$package" circlesac/cgrok "v${VERSION}"
          done

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/cgrok.rb "apt/manifests/cgrok/${VERSION}"
          git diff --cached --quiet && exit 0
          git commit -m "Update cgrok to ${VERSION}"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin main; then
              exit 0
            fi
            printf 'push attempt %s failed\n' "$attempt" >&2
          done
          exit 1
