name: Release

on:
  workflow_dispatch:
    inputs:
      env:
        type: choice
        description: Environment
        default: production
        options:
          - production
          - dev

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun test

      - run: bun run build.ts

      - name: Bump version
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm install -g @circlesac/oneup
          oneup version
          VERSION=$(jq -r .version package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: versioned-files
          path: package.json

  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: bun-darwin-x64
            name: cgrok-darwin-x64
          - target: bun-darwin-arm64
            name: cgrok-darwin-arm64
          - target: bun-linux-x64
            name: cgrok-linux-x64
          - target: bun-linux-arm64
            name: cgrok-linux-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: versioned-files

      - name: Build binary
        run: |
          bun build --compile --target=${{ matrix.target }} --external react-devtools-core --outfile=cgrok src/main.ts
          tar czf ${{ matrix.name }}.tar.gz cgrok

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.tar.gz

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            bin/install.sh

  publish-npm:
    needs: [version, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: versioned-files

      - run: bun run build.ts

      - name: Publish
        run: npm publish --tag ${{ inputs.env == 'production' && 'latest' || inputs.env }} --provenance --access public

      - name: Push version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "v${{ needs.version.outputs.version }}"
          git tag "v${{ needs.version.outputs.version }}" || true
          git push origin ${{ github.ref_name }} --follow-tags

  publish-homebrew:
    needs: [version, release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Update Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION=${{ needs.version.outputs.version }}

          SHA_DARWIN_ARM64=$(shasum -a 256 artifacts/cgrok-darwin-arm64/*.tar.gz | cut -d' ' -f1)
          SHA_DARWIN_X64=$(shasum -a 256 artifacts/cgrok-darwin-x64/*.tar.gz | cut -d' ' -f1)
          SHA_LINUX_ARM64=$(shasum -a 256 artifacts/cgrok-linux-arm64/*.tar.gz | cut -d' ' -f1)
          SHA_LINUX_X64=$(shasum -a 256 artifacts/cgrok-linux-x64/*.tar.gz | cut -d' ' -f1)

          git clone https://x-access-token:${GH_TOKEN}@github.com/circlesac/homebrew-tap.git
          cd homebrew-tap
          cp ../homebrew/cgrok.rb.template Formula/cgrok.rb
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" Formula/cgrok.rb
          sed -i "s/SHA_DARWIN_ARM64/${SHA_DARWIN_ARM64}/g" Formula/cgrok.rb
          sed -i "s/SHA_DARWIN_X64/${SHA_DARWIN_X64}/g" Formula/cgrok.rb
          sed -i "s/SHA_LINUX_ARM64/${SHA_LINUX_ARM64}/g" Formula/cgrok.rb
          sed -i "s/SHA_LINUX_X64/${SHA_LINUX_X64}/g" Formula/cgrok.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/cgrok.rb
          git commit -m "Update cgrok to ${VERSION}"
          git push
